paths:
  cve_dataset: "datasets/cve-list.csv"
  identity_dataset: "lab-setup/identity-data.csv"
  enriched_vulnerabilities: "engine/real-enriched-vulnerabilities.csv"
  scored_identities: "engine/scored-identities.csv"
  unified_scores: "engine/unified-risk-scores.csv"

scoring:
  epss_weight: 0.5
  identity_weight: 0.5
  risk_threshold_critical: 0.8
  risk_threshold_high: 0.5

identity_scoring:
